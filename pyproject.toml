[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-support"
version = "0.1.0"
description = "A traced RAG support agent that answers FastAPI questions from its docs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "openai",
    "langfuse",
    "numpy",
    "python-dotenv",
]

[project.optional-dependencies]
# dev includes ui so the web tests run on a plain .[dev] install.
dev = ["pytest", "ruff", "black", "mypy", "httpx", "rag-support[ui]"]
# Local web UI. fastapi>=0.165 requires starlette>=1.6, past the 2026 Starlette
# security fixes (the latest, CVE-2026-54283, was fixed in 1.3.1).
ui = ["fastapi>=0.165.0", "uvicorn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_support = ["static/*.html"]

[tool.black]
line-length = 88
# Downloaded material is data, never code for our tools to parse.
extend-exclude = "^/data/"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
