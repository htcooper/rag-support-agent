[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-support"
version = "0.1.0"
description = "A traced RAG support agent that answers FastAPI questions from its docs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "openai",
    "langfuse",
    "numpy",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
# Downloaded material is data, never code for our tools to parse.
extend-exclude = "^/data/"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
